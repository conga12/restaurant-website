<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - RestaurantOS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/auth/css/auth.css" rel="stylesheet">
</head>
<body>
    <div class="auth-wrapper">
        <!-- Left Side - Branding -->
        <div class="auth-branding">
            <div class="branding-content">
                <div class="logo">
                    <i class="bi bi-shop"></i>
                    <span>RestaurantOS</span>
                </div>
                <h1>Quản lý nhà hàng<br>thông minh</h1>
                <p>Hệ thống quản lý toàn diện giúp bạn điều hành nhà hàng hiệu quả hơn.</p>
                
                <div class="stats">
                    <div class="stat-item">
                        <h3>500+</h3>
                        <p>Nhà hàng</p>
                    </div>
                    <div class="stat-item">
                        <h3>1M+</h3>
                        <p>Đơn hàng/tháng</p>
                    </div>
                    <div class="stat-item">
                        <h3>99.9%</h3>
                        <p>Uptime</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side - Login Form -->
        <div class="auth-form-container">
            <div class="auth-form">
                <div class="form-header">
                    <h2>Đăng nhập</h2>
                    <p>Chào mừng trở lại! Vui lòng đăng nhập để tiếp tục.</p>
                </div>

                <form action="/login" method="post">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <div class="input-icon">
                            <i class="bi bi-envelope"></i>
                            <input type="email" name="username" class="form-control" placeholder="admin@restaurant.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mật khẩu</label>
                        <div class="input-icon">
                            <i class="bi bi-lock"></i>
                            <input type="password" name="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required>
                            <button type="button" class="btn-toggle-password" onclick="togglePassword()">
                                <i class="bi bi-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="remember">
                            <label class="form-check-label" for="remember">Ghi nhớ đăng nhập</label>
                        </div>
                        <a href="forgot-password.html" class="forgot-link">Quên mật khẩu?</a>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Đăng nhập
                    </button>

                    <div class="divider">
                        <span>hoặc</span>
                    </div>

                    <button type="button" class="btn btn-outline-secondary w-100 mb-2">
                        <i class="bi bi-google me-2"></i> Đăng nhập với Google
                    </button>
                </form>

                <div class="form-footer">
                    <p>Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword() {
            const password = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (password.type === 'password') {
                password.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                password.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }
    </script>
</body>
</html>
